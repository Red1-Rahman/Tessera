[package]
name = "tessera"
version = "0.1.0"
description = "Local, offline editor that keeps a LaTeX document and a DOCX document in sync."
authors = ["Redwan Rahman"]
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"
repository = "https://github.com/redwanrahman/tessera"

[lib]
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
